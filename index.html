<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
    background: #faf8ef;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    touch-action: none;
  }

  .container {
    width: 500px;
    max-width: 95vw;
  }

  /* ── Header ─────────────────────────────── */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }
  .title {
    font-size: 72px;
    font-weight: 700;
    color: #776e65;
    line-height: 1;
  }
  .scores {
    display: flex;
    gap: 8px;
  }
  .score-box {
    background: #bbada0;
    border-radius: 6px;
    padding: 8px 20px;
    text-align: center;
    color: #eee4da;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    min-width: 80px;
  }
  .score-box .value {
    color: #fff;
    font-size: 22px;
    display: block;
    margin-top: 2px;
  }

  /* ── Subtitle / New‑Game ────────────────── */
  .sub-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .tagline {
    color: #776e65;
    font-size: 16px;
  }
  .tagline b { font-weight: 700; }
  .new-game-btn {
    background: #8f7a66;
    color: #f9f6f2;
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .new-game-btn:hover { background: #9f8b77; }

  /* ── Board ──────────────────────────────── */
  .board {
    position: relative;
    background: #bbada0;
    border-radius: 8px;
    padding: 12px;
    aspect-ratio: 1 / 1;
    width: 100%;
  }
  .grid-bg {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 12px;
    width: 100%;
    height: 100%;
  }
  .cell-bg {
    background: rgba(238,228,218,0.35);
    border-radius: 6px;
  }

  /* ── Tiles ──────────────────────────────── */
  .tile-container {
    position: absolute;
    inset: 12px;
  }
  .tile {
    position: absolute;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 700;
    border-radius: 6px;
    transition: top 120ms ease-in-out, left 120ms ease-in-out;
    z-index: 10;
  }
  .tile.new {
    animation: pop-in 200ms ease;
  }
  .tile.merged {
    animation: pop-merge 200ms ease;
    z-index: 20;
  }
  @keyframes pop-in {
    0%   { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes pop-merge {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  /* ── Overlay ────────────────────────────── */
  .overlay {
    display: none;
    position: absolute;
    inset: 0;
    border-radius: 8px;
    background: rgba(238,228,218,0.73);
    z-index: 100;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
  }
  .overlay.active { display: flex; }
  .overlay .msg {
    font-size: 48px;
    font-weight: 700;
    color: #776e65;
  }
  .overlay button {
    background: #8f7a66;
    color: #f9f6f2;
    border: none;
    border-radius: 6px;
    padding: 10px 24px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }

  /* ── Responsive ─────────────────────────── */
  @media (max-width: 520px) {
    .title { font-size: 48px; }
    .board { padding: 8px; }
    .grid-bg { gap: 8px; }
  }
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box">Score<span class="value" id="score">0</span></div>
      <div class="score-box">Best<span class="value" id="best">0</span></div>
    </div>
  </div>

  <!-- Subtitle -->
  <div class="sub-header">
    <div class="tagline">Join the numbers and get to the <b>2048 tile!</b></div>
    <button class="new-game-btn" id="newGameBtn">New Game</button>
  </div>

  <!-- Board -->
  <div class="board" id="board">
    <div class="grid-bg">
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
    </div>
    <div class="tile-container" id="tileContainer"></div>

    <!-- Win / Lose overlays -->
    <div class="overlay" id="winOverlay">
      <div class="msg">You win! 🎉</div>
      <button id="keepGoingBtn">Keep going</button>
      <button id="winNewGameBtn">New Game</button>
    </div>
    <div class="overlay" id="loseOverlay">
      <div class="msg">Game over!</div>
      <button id="loseNewGameBtn">Try again</button>
    </div>
  </div>
</div>

<script>
/* ================================================================
   2048 – Pure JS Engine
   ================================================================ */
const SIZE = 4;

/* ── Tile color map (original 2048 palette) ─────────────── */
const TILE_STYLE = {
  2:    { bg:'#eee4da', color:'#776e65', fontSize: 2   },
  4:    { bg:'#ede0c8', color:'#776e65', fontSize: 2   },
  8:    { bg:'#f2b179', color:'#f9f6f2', fontSize: 2   },
  16:   { bg:'#f59563', color:'#f9f6f2', fontSize: 2   },
  32:   { bg:'#f67c5f', color:'#f9f6f2', fontSize: 2   },
  64:   { bg:'#f65e3b', color:'#f9f6f2', fontSize: 2   },
  128:  { bg:'#edcf72', color:'#f9f6f2', fontSize: 1.8 },
  256:  { bg:'#edcc61', color:'#f9f6f2', fontSize: 1.8 },
  512:  { bg:'#edc850', color:'#f9f6f2', fontSize: 1.8 },
  1024: { bg:'#edc53f', color:'#f9f6f2', fontSize: 1.5 },
  2048: { bg:'#edc22e', color:'#f9f6f2', fontSize: 1.5 },
};

function tileStyle(v) {
  if (TILE_STYLE[v]) return TILE_STYLE[v];
  return { bg: '#3c3a32', color: '#f9f6f2', fontSize: 1.3 };
}

/* ── State ───────────────────────────────────────────────── */
let grid, score, best, won, keepPlaying, busy;

const $score    = document.getElementById('score');
const $best     = document.getElementById('best');
const $tc       = document.getElementById('tileContainer');
const $winOvl   = document.getElementById('winOverlay');
const $loseOvl  = document.getElementById('loseOverlay');

best = +(localStorage.getItem('best2048') || 0);
$best.textContent = best;

/* ── Helpers ─────────────────────────────────────────────── */
function emptyGrid() { return Array.from({length:SIZE}, ()=>Array(SIZE).fill(0)); }

function emptyCells(g) {
  const e = [];
  g.forEach((r,ri)=>r.forEach((v,ci)=>{ if(!v) e.push([ri,ci]); }));
  return e;
}

function addRandom(g) {
  const e = emptyCells(g);
  if (!e.length) return;
  const [r,c] = e[Math.floor(Math.random()*e.length)];
  g[r][c] = Math.random() < 0.9 ? 2 : 4;
  return [r,c, g[r][c]];
}

/* ── Slide one row left ──────────────────────────────────── */
function slideRow(row) {
  let a = row.filter(v=>v), merged = 0;
  for (let i = 0; i < a.length - 1; i++) {
    if (a[i] === a[i+1]) { a[i] *= 2; merged += a[i]; a.splice(i+1,1); }
  }
  while (a.length < SIZE) a.push(0);
  return { row: a, merged };
}

/* ── Move whole grid ─────────────────────────────────────── */
function move(dir) {
  // 0=left  1=up  2=right  3=down
  let g = grid.map(r=>[...r]), pts = 0, moved = false;

  const rotate = (g) => g[0].map((_,c) => g.map(r=>r[c]).reverse());
  let rotations = dir;  // rotate dir times so we always slide left
  for (let i = 0; i < rotations; i++) g = rotate(g);

  for (let r = 0; r < SIZE; r++) {
    const { row, merged } = slideRow(g[r]);
    if (row.some((v,i)=>v!==g[r][i])) moved = true;
    g[r] = row;
    pts += merged;
  }

  // rotate back
  for (let i = 0; i < (4 - rotations) % 4; i++) g = rotate(g);

  return { grid: g, points: pts, moved };
}

function canMove(g) {
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++) {
      if (!g[r][c]) return true;
      if (c < SIZE-1 && g[r][c] === g[r][c+1]) return true;
      if (r < SIZE-1 && g[r][c] === g[r+1][c]) return true;
    }
  return false;
}

function hasValue(g, v) {
  return g.some(r=>r.includes(v));
}

/* ── Rendering ───────────────────────────────────────────── */
function cellSize() {
  const board = document.getElementById('board');
  const inner = board.clientWidth - 24;          // padding 12*2
  return (inner - 12 * 3) / 4;                  // gap 12 * 3
}

function renderTiles(newTile, mergedSet) {
  $tc.innerHTML = '';
  const cs = cellSize();
  const gap = 12;
  grid.forEach((row, r) => {
    row.forEach((val, c) => {
      if (!val) return;
      const s = tileStyle(val);
      const el = document.createElement('div');
      el.className = 'tile';
      if (newTile && newTile[0]===r && newTile[1]===c) el.classList.add('new');
      if (mergedSet && mergedSet.has(r+','+c)) el.classList.add('merged');
      el.textContent = val;
      const left = c * (cs + gap);
      const top  = r * (cs + gap);
      el.style.cssText = `
        width:${cs}px; height:${cs}px;
        top:${top}px; left:${left}px;
        background:${s.bg}; color:${s.color};
        font-size:${cs * 0.38 * (s.fontSize/2)}px;
      `;
      $tc.appendChild(el);
    });
  });
}

function updateScore(pts) {
  score += pts;
  $score.textContent = score;
  if (score > best) { best = score; $best.textContent = best; localStorage.setItem('best2048', best); }
}

/* ── Game flow ───────────────────────────────────────────── */
function newGame() {
  grid = emptyGrid();
  score = 0; won = false; keepPlaying = false; busy = false;
  $score.textContent = 0;
  $winOvl.classList.remove('active');
  $loseOvl.classList.remove('active');
  addRandom(grid);
  const nt = addRandom(grid);
  renderTiles(nt ? [nt[0],nt[1]] : null);
}

function handleMove(dir) {
  if (busy) return;
  const result = move(dir);
  if (!result.moved) return;
  busy = true;
  grid = result.grid;
  updateScore(result.points);

  // detect merged positions (approximate: tiles whose value doubled)
  const mergedSet = new Set();
  result.grid.forEach((row, r) => row.forEach((v, c) => {
    if (v && result.points) mergedSet.add(r+','+c);
  }));

  const nt = addRandom(grid);
  renderTiles(nt ? [nt[0],nt[1]] : null, mergedSet);

  setTimeout(() => {
    if (!won && !keepPlaying && hasValue(grid, 2048)) {
      won = true;
      $winOvl.classList.add('active');
    } else if (!canMove(grid)) {
      $loseOvl.classList.add('active');
    }
    busy = false;
  }, 150);
}

/* ── Input ───────────────────────────────────────────────── */
const DIR = { ArrowLeft:0, ArrowUp:1, ArrowRight:2, ArrowDown:3, a:0, w:1, d:2, s:3 };

document.addEventListener('keydown', e => {
  if (DIR[e.key] !== undefined) { e.preventDefault(); handleMove(DIR[e.key]); }
});

// Touch / swipe
let tx, ty;
document.getElementById('board').addEventListener('touchstart', e => {
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
});
document.getElementById('board').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
  if (Math.abs(dx) > Math.abs(dy)) handleMove(dx > 0 ? 2 : 0);
  else handleMove(dy > 0 ? 3 : 1);
});

/* ── Buttons ─────────────────────────────────────────────── */
document.getElementById('newGameBtn').onclick = newGame;
document.getElementById('winNewGameBtn').onclick = newGame;
document.getElementById('loseNewGameBtn').onclick = newGame;
document.getElementById('keepGoingBtn').onclick = () => {
  keepPlaying = true;
  $winOvl.classList.remove('active');
};

/* ── Resize ──────────────────────────────────────────────── */
window.addEventListener('resize', () => renderTiles());

/* ── Start! ──────────────────────────────────────────────── */
newGame();
</script>
</body>
</html>
